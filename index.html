<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ぷよぷよ</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f4f5f7;
      color: #22262e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* タイトル画面 */
    #title-screen {
      position: fixed;
      inset: 0;
      background: #f4f5f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 100;
      padding: 24px;
    }

    #title-screen.hidden {
      display: none;
    }

    .title-logo {
      margin: 0;
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .title-card {
      width: 100%;
      max-width: 300px;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 14px 16px;
    }

    .label {
      font-size: 12px;
      font-weight: 700;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .chip-btn {
      padding: 9px 6px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      background: #f4f5f7;
      color: #22262e;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .chip-btn.active {
      background: #3b82f6;
      border-color: #3b82f6;
      color: #ffffff;
    }

    .start-btn {
      padding: 14px 44px;
      font-size: 17px;
      font-weight: 800;
      color: #ffffff;
      background: #22262e;
      border: none;
      border-radius: 999px;
      cursor: pointer;
    }

    /* ゲーム画面 */
    #game-screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 12px 14px;
      position: relative;
      touch-action: none;
    }

    #settings-btn {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #22262e;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 40;
    }

    .stage {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 8px;
    }

    .board-box {
      position: relative;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 6px;
    }

    #board-canvas {
      display: block;
      background: #ebedf0;
      border-radius: 8px;
    }

    .next-box {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .next-title {
      font-size: 10px;
      font-weight: 800;
      color: #6b7280;
    }

    #next-canvas {
      display: block;
    }

    /* 連鎖カットイン演出 */
    #chain-pop {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.3);
      font-size: 24px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 0.04em;
      color: #fde047;
      -webkit-text-stroke: 1.5px #22262e;
      text-shadow: 0 4px 0 rgba(34, 38, 46, 0.85), 0 8px 18px rgba(0, 0, 0, 0.25);
      pointer-events: none;
      opacity: 0;
      white-space: nowrap;
      z-index: 15;
    }

    #chain-pop.show {
      animation: puyoChainPop 0.82s cubic-bezier(0.22, 1.45, 0.36, 1) forwards;
    }

    @keyframes puyoChainPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -30%) scale(0.35) rotate(-6deg);
      }
      22% {
        opacity: 1;
        transform: translate(-50%, -54%) scale(1.22) rotate(3deg);
      }
      45% {
        opacity: 1;
        transform: translate(-50%, -48%) scale(0.96) rotate(-1deg);
      }
      75% {
        opacity: 1;
        transform: translate(-50%, -52%) scale(1.04) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -68%) scale(0.9) rotate(0deg);
      }
    }

    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #6b7280;
      text-align: center;
    }

    /* モーダル */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 80;
      padding: 20px;
    }

    .modal-bg.open {
      display: flex;
    }

    .modal-panel {
      width: 100%;
      max-width: 310px;
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
    }

    .modal-panel h2 {
      margin: 0 0 16px;
      font-size: 17px;
      text-align: center;
    }

    .sec {
      margin-bottom: 14px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
    }

    .act-btn {
      width: 100%;
      padding: 11px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .act-reset {
      background: #fee2e2;
      color: #dc2626;
    }

    .act-secondary {
      background: #e5e7eb;
      color: #22262e;
    }

    .act-close {
      background: #22262e;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <!-- タイトル画面 -->
  <div id="title-screen">
    <h1 class="title-logo">ぷよぷよ</h1>

    <div class="title-card">
      <div class="label">ぷよの色数</div>
      <div class="grid-3">
        <button type="button" class="chip-btn color-choice" data-colors="3">3色</button>
        <button type="button" class="chip-btn color-choice active" data-colors="4">4色</button>
        <button type="button" class="chip-btn color-choice" data-colors="5">5色</button>
      </div>
    </div>

    <button type="button" id="start-btn" class="start-btn">スタート</button>
  </div>

  <!-- 設定ボタン -->
  <button type="button" id="settings-btn">設定</button>

  <!-- ゲーム画面 -->
  <div id="game-screen">
    <div class="stage">
      <div class="board-box">
        <canvas id="board-canvas"></canvas>
        <div id="chain-pop">2連鎖!</div>
      </div>

      <div class="next-box">
        <div class="next-title">NEXT</div>
        <canvas id="next-canvas" width="32" height="120"></canvas>
      </div>
    </div>

    <div class="hint">左右スワイプ: 移動 / 下ドラッグ・フリック: 落下 / 左右タップ: 回転</div>
  </div>

  <!-- 設定モーダル -->
  <div id="settings-modal" class="modal-bg">
    <div class="modal-panel">
      <h2>設定</h2>

      <div class="sec">
        <div class="label">落下スピード</div>
        <div class="grid-2">
          <button type="button" class="chip-btn speed-choice" data-speed="0">手動のみ</button>
          <button type="button" class="chip-btn speed-choice" data-speed="1000">ゆっくり</button>
          <button type="button" class="chip-btn speed-choice active" data-speed="600">ふつう</button>
          <button type="button" class="chip-btn speed-choice" data-speed="250">はやい</button>
        </div>
      </div>

      <div class="sec">
        <div class="label">フリック感度</div>
        <div class="grid-3">
          <button type="button" class="chip-btn sens-choice" data-sens="low">ゆったり</button>
          <button type="button" class="chip-btn sens-choice active" data-sens="mid">ふつう</button>
          <button type="button" class="chip-btn sens-choice" data-sens="high">敏感</button>
        </div>
      </div>

      <div class="sec">
        <div class="label">落下予測（ゴースト）</div>
        <div class="grid-2">
          <button type="button" class="chip-btn ghost-choice active" data-ghost="1">表示する</button>
          <button type="button" class="chip-btn ghost-choice" data-ghost="0">非表示</button>
        </div>
      </div>

      <div class="actions">
        <button type="button" id="reset-btn" class="act-btn act-reset">盤面をリセット</button>
        <button type="button" id="close-settings-btn" class="act-btn act-close">閉じる</button>
      </div>
    </div>
  </div>

  <!-- ゲームオーバーモーダル -->
  <div id="gameover-modal" class="modal-bg">
    <div class="modal-panel">
      <h2>ここまで積み上がりました</h2>
      <div class="actions">
        <button type="button" id="retry-btn" class="act-btn act-close">リトライ</button>
        <button type="button" id="back-title-btn" class="act-btn act-secondary">タイトル画面へ</button>
      </div>
    </div>
  </div>

  <script>
    const COLS = 6;
    const VISIBLE_ROWS = 12;
    const HIDDEN_ROWS = 1;
    const TOTAL_ROWS = VISIBLE_ROWS + HIDDEN_ROWS;

    // 目なしの柔らかいゼリー・水滴カラーパレット
    const COLORS = [
      null,
      { light: "#ffb4b4", fill: "#f87171", deep: "#dc2626" }, // やわらか赤
      { light: "#bfdbfe", fill: "#60a5fa", deep: "#2563eb" }, // やわらか青
      { light: "#bbf7d0", fill: "#4ade80", deep: "#16a34a" }, // やわらか緑
      { light: "#fef08a", fill: "#facc15", deep: "#ca8a04" }, // やわらか黄
      { light: "#e9d5ff", fill: "#c084fc", deep: "#9333ea" }  // やわらか紫
    ];

    const DIRS = [
      { dx: 0, dy: -1 },
      { dx: 1, dy: 0 },
      { dx: 0, dy: 1 },
      { dx: -1, dy: 0 }
    ];

    const SENSITIVITY_PRESETS = {
      low:  { stepRatio: 0.90, flickDist: 62 },
      mid:  { stepRatio: 0.65, flickDist: 45 },
      high: { stepRatio: 0.42, flickDist: 32 }
    };

    const titleScreen = document.getElementById("title-screen");
    const startBtn = document.getElementById("start-btn");
    const settingsBtn = document.getElementById("settings-btn");
    const settingsModal = document.getElementById("settings-modal");
    const closeSettingsBtn = document.getElementById("close-settings-btn");
    const resetBtn = document.getElementById("reset-btn");
    const gameoverModal = document.getElementById("gameover-modal");
    const retryBtn = document.getElementById("retry-btn");
    const backTitleBtn = document.getElementById("back-title-btn");
    const chainPop = document.getElementById("chain-pop");

    const boardCanvas = document.getElementById("board-canvas");
    const ctx = boardCanvas.getContext("2d");
    const nextCanvas = document.getElementById("next-canvas");
    const nextCtx = nextCanvas.getContext("2d");
    const gameScreen = document.getElementById("game-screen");

    let cellSize = 36;
    let board = [];
    let current = null;
    let nextQueue = [];

    let colorCount = 4;
    let dropMs = 600;
    let sensitivity = "mid";
    let showGhost = true;

    let running = false;
    let resolving = false;
    let settingsOpen = false;
    let gameOver = false;
    let fallTimer = null;

    let poppingCells = new Map();
    let particles = [];
    let landingSquash = [];
    let animFrameId = null;

    function fitBoard() {
      const maxH = window.innerHeight - 110;
      const maxW = window.innerWidth - 105;
      cellSize = Math.max(26, Math.min(44, Math.floor(Math.min(maxW / COLS, maxH / VISIBLE_ROWS))));
      boardCanvas.width = COLS * cellSize;
      boardCanvas.height = VISIBLE_ROWS * cellSize;
      draw();
    }

    function randColor() {
      return Math.floor(Math.random() * colorCount) + 1;
    }

    function makePair() {
      return { main: randColor(), sub: randColor() };
    }

    function makeBoard() {
      return Array.from({ length: TOTAL_ROWS }, () => Array(COLS).fill(0));
    }

    function clearFallTimer() {
      if (fallTimer !== null) {
        clearInterval(fallTimer);
        fallTimer = null;
      }
    }

    function setupFallTimer() {
      clearFallTimer();
      if (!running || settingsOpen || resolving || gameOver || dropMs <= 0) return;
      fallTimer = setInterval(() => {
        if (running && !settingsOpen && !resolving && !gameOver && current) {
          stepDown();
        }
      }, dropMs);
    }

    function resetBoardState() {
      running = true;
      settingsOpen = false;
      settingsModal.classList.remove("open");
      clearFallTimer();
      board = makeBoard();
      nextQueue = [makePair(), makePair()];
      poppingCells.clear();
      particles = [];
      landingSquash = [];
      resolving = false;
      gameOver = false;
      gameoverModal.classList.remove("open");
      fitBoard();
      spawnNextPiece();
      setupFallTimer();
      draw();
    }

    function goToTitle() {
      clearFallTimer();
      running = false;
      resolving = false;
      settingsOpen = false;
      gameOver = false;
      current = null;
      settingsModal.classList.remove("open");
      gameoverModal.classList.remove("open");
      titleScreen.classList.remove("hidden");
    }

    function spawnNextPiece() {
      const pair = nextQueue.shift();
      nextQueue.push(makePair());
      drawNext();

      current = {
        x: 2,
        y: 1,
        rot: 0,
        main: pair.main,
        sub: pair.sub
      };

      if (board[1][2] !== 0) {
        current = null;
        gameOver = true;
        clearFallTimer();
        gameoverModal.classList.add("open");
      }
    }

    function subPos(x, y, rot) {
      return { x: x + DIRS[rot].dx, y: y + DIRS[rot].dy };
    }

    function canPlace(x, y, rot) {
      const s = subPos(x, y, rot);
      const pts = [{ x, y }, s];
      for (const p of pts) {
        if (p.x < 0 || p.x >= COLS || p.y < 0 || p.y >= TOTAL_ROWS) return false;
        if (board[p.y][p.x] !== 0) return false;
      }
      return true;
    }

    function canControl() {
      return running && !settingsOpen && !resolving && !gameOver && current !== null;
    }

    function moveX(dx) {
      if (!canControl()) return;
      if (canPlace(current.x + dx, current.y, current.rot)) {
        current.x += dx;
        draw();
      }
    }

    function turn(dir) {
      if (!canControl()) return;
      const nextRot = (current.rot + dir + 4) % 4;
      if (canPlace(current.x, current.y, nextRot)) {
        current.rot = nextRot;
        draw();
        return;
      }
      const kicks = [
        { dx: -1, dy: 0 },
        { dx: 1, dy: 0 },
        { dx: 0, dy: -1 }
      ];
      for (const k of kicks) {
        if (canPlace(current.x + k.dx, current.y + k.dy, nextRot)) {
          current.x += k.dx;
          current.y += k.dy;
          current.rot = nextRot;
          draw();
          return;
        }
      }
    }

    function stepDown() {
      if (!canControl()) return;
      if (canPlace(current.x, current.y + 1, current.rot)) {
        current.y += 1;
        draw();
      } else {
        fixPiece();
      }
    }

    function dropHard() {
      if (!canControl()) return;
      while (canPlace(current.x, current.y + 1, current.rot)) {
        current.y += 1;
      }
      draw();
      fixPiece();
    }

    function addLandingSquash(x, y) {
      if (y < HIDDEN_ROWS) return;
      landingSquash = landingSquash.filter((item) => !(item.x === x && item.y === y));
      landingSquash.push({ x, y, frames: 6 });
    }

    function fixPiece() {
      if (!current) return;
      clearFallTimer();
      const s = subPos(current.x, current.y, current.rot);
      board[current.y][current.x] = current.main;
      addLandingSquash(current.x, current.y);
      if (s.y >= 0 && s.y < TOTAL_ROWS) {
        board[s.y][s.x] = current.sub;
        addLandingSquash(s.x, s.y);
      }
      current = null;
      startEffectLoop();
      resolveChains();
    }

    function dropFloating() {
      let moved = false;
      for (let x = 0; x < COLS; x++) {
        let writeY = TOTAL_ROWS - 1;
        for (let y = TOTAL_ROWS - 1; y >= 0; y--) {
          if (board[y][x] !== 0) {
            if (y !== writeY) {
              board[writeY][x] = board[y][x];
              board[y][x] = 0;
              moved = true;
            }
            writeY--;
          }
        }
      }
      return moved;
    }

    function findGroups() {
      const seen = Array.from({ length: TOTAL_ROWS }, () => Array(COLS).fill(false));
      const targets = [];

      for (let y = HIDDEN_ROWS; y < TOTAL_ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const c = board[y][x];
          if (c === 0 || seen[y][x]) continue;

          const group = [];
          const q = [{ x, y }];
          seen[y][x] = true;

          while (q.length > 0) {
            const p = q.shift();
            group.push(p);
            for (const d of DIRS) {
              const nx = p.x + d.dx;
              const ny = p.y + d.dy;
              if (
                nx >= 0 && nx < COLS &&
                ny >= HIDDEN_ROWS && ny < TOTAL_ROWS &&
                !seen[ny][nx] &&
                board[ny][nx] === c
              ) {
                seen[ny][nx] = true;
                q.push({ x: nx, y: ny });
              }
            }
          }

          if (group.length >= 4) {
            targets.push(...group);
          }
        }
      }
      return targets;
    }

    const wait = (ms) => new Promise((r) => setTimeout(r, ms));

    function showChainPop(n) {
      if (n < 2) return;
      chainPop.textContent = `${n}連鎖!`;

      const scaleBoost = Math.min(1.45, 1 + (n - 2) * 0.08);
      chainPop.style.fontSize = `${Math.round(24 * scaleBoost)}px`;

      if (n >= 5) {
        chainPop.style.color = "#ff6b6b";
      } else if (n === 4) {
        chainPop.style.color = "#fb923c";
      } else if (n === 3) {
        chainPop.style.color = "#facc15";
      } else {
        chainPop.style.color = "#fde047";
      }

      chainPop.classList.remove("show");
      void chainPop.offsetWidth;
      chainPop.classList.add("show");
    }

    function spawnPopBurst(x, y, colorId) {
      const col = COLORS[colorId];
      if (!col) return;
      const cx = x * cellSize + cellSize / 2;
      const cy = (y - HIDDEN_ROWS) * cellSize + cellSize / 2;

      for (let i = 0; i < 7; i++) {
        const angle = (Math.PI * 2 * i) / 7 + (Math.random() - 0.5) * 0.4;
        const speed = 1.6 + Math.random() * 2.4;
        particles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.2,
          r: Math.max(3, cellSize * (0.09 + Math.random() * 0.06)),
          color: col.fill,
          alpha: 1,
          life: 1
        });
      }
    }

    function startEffectLoop() {
      if (animFrameId !== null) return;
      const step = () => {
        let active = false;

        if (particles.length > 0) {
          active = true;
          for (const pt of particles) {
            pt.x += pt.vx;
            pt.y += pt.vy;
            pt.vy += 0.14;
            pt.life -= 0.055;
            pt.alpha = Math.max(0, pt.life);
          }
          particles = particles.filter((pt) => pt.life > 0);
        }

        if (landingSquash.length > 0) {
          active = true;
          for (const sq of landingSquash) {
            sq.frames -= 1;
          }
          landingSquash = landingSquash.filter((sq) => sq.frames > 0);
        }

        if (poppingCells.size > 0) {
          active = true;
        }

        draw();

        if (active) {
          animFrameId = requestAnimationFrame(step);
        } else {
          animFrameId = null;
        }
      };
      animFrameId = requestAnimationFrame(step);
    }

    async function resolveChains() {
      resolving = true;
      let chain = 0;

      if (dropFloating()) {
        draw();
        await wait(140);
      }

      while (true) {
        const matches = findGroups();
        if (matches.length === 0) break;

        chain += 1;
        showChainPop(chain);

        poppingCells.clear();
        for (const m of matches) {
          poppingCells.set(`${m.x},${m.y}`, {
            scaleX: 1.26,
            scaleY: 1.26,
            color: board[m.y][m.x]
          });
        }
        startEffectLoop();
        draw();
        await wait(150);

        for (const m of matches) {
          const c = board[m.y][m.x];
          board[m.y][m.x] = 0;
          spawnPopBurst(m.x, m.y, c);
        }
        poppingCells.clear();
        startEffectLoop();
        draw();
        await wait(140);

        if (dropFloating()) {
          draw();
          await wait(160);
        }
      }

      resolving = false;
      if (running && !gameOver) {
        spawnNextPiece();
        setupFallTimer();
        draw();
      }
    }

    // 目なしのぷにっとしたゼリー・水滴風描画
    function paintPuyo(c2d, px, py, size, colorId, link = null, alpha = 1, scaleX = 1, scaleY = 1) {
      if (!colorId) return;
      const col = COLORS[colorId];
      const cx = px + size / 2;
      const cy = py + size / 2;
      const rx = size * 0.44;
      const ryTop = size * 0.41;
      const ryBot = size * 0.46;

      c2d.save();
      c2d.globalAlpha = alpha;
      c2d.translate(cx, cy);
      c2d.scale(scaleX, scaleY);
      c2d.translate(-cx, -cy);

      // 同色連結ブリッジ
      if (link) {
        const bw = rx * 1.15;
        c2d.fillStyle = col.fill;
        if (link.up) c2d.fillRect(cx - bw / 2, py, bw, size / 2 + 1);
        if (link.down) c2d.fillRect(cx - bw / 2, cy - 1, bw, size / 2 + 1);
        if (link.left) c2d.fillRect(px, cy - bw / 2, size / 2 + 1, bw);
        if (link.right) c2d.fillRect(cx - 1, cy - bw / 2, size / 2 + 1, bw);
      }

      // ぷにっとした本体シルエット
      c2d.beginPath();
      c2d.moveTo(cx - rx, cy);
      c2d.bezierCurveTo(cx - rx, cy - ryTop * 1.12, cx + rx, cy - ryTop * 1.12, cx + rx, cy);
      c2d.bezierCurveTo(cx + rx * 1.05, cy + ryBot * 1.05, cx - rx * 1.05, cy + ryBot * 1.05, cx - rx, cy);
      c2d.closePath();

      // 柔らかいグラデーション塗り
      const grad = c2d.createRadialGradient(
        cx - rx * 0.25,
        cy - ryTop * 0.35,
        size * 0.04,
        cx,
        cy + ryBot * 0.1,
        size * 0.55
      );
      grad.addColorStop(0, col.light);
      grad.addColorStop(0.58, col.fill);
      grad.addColorStop(1, col.deep);

      c2d.fillStyle = grad;
      c2d.fill();

      // やわらかいゼリー・水滴の光沢ハイライト（2粒でぷるん感）
      c2d.fillStyle = "rgba(255, 255, 255, 0.65)";
      c2d.beginPath();
      c2d.ellipse(
        cx - rx * 0.32,
        cy - ryTop * 0.36,
        rx * 0.24,
        ryTop * 0.14,
        -0.55,
        0,
        Math.PI * 2
      );
      c2d.fill();

      c2d.fillStyle = "rgba(255, 255, 255, 0.45)";
      c2d.beginPath();
      c2d.arc(cx - rx * 0.06, cy - ryTop * 0.56, Math.max(1.5, rx * 0.09), 0, Math.PI * 2);
      c2d.fill();

      c2d.restore();
    }

    function drawNext() {
      nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
      if (nextQueue.length < 2) return;

      const p1 = nextQueue[0];
      const p2 = nextQueue[1];

      const s1 = 28;
      const x1 = (nextCanvas.width - s1) / 2;
      paintPuyo(nextCtx, x1, 2, s1, p1.sub);
      paintPuyo(nextCtx, x1, 2 + s1 - 2, s1, p1.main);

      nextCtx.strokeStyle = "#e5e7eb";
      nextCtx.lineWidth = 1;
      nextCtx.beginPath();
      nextCtx.moveTo(4, 62);
      nextCtx.lineTo(nextCanvas.width - 4, 62);
      nextCtx.stroke();

      const s2 = 20;
      const x2 = (nextCanvas.width - s2) / 2;
      paintPuyo(nextCtx, x2, 70, s2, p2.sub);
      paintPuyo(nextCtx, x2, 70 + s2 - 2, s2, p2.main);
    }

    function getSquashScale(x, y) {
      const sq = landingSquash.find((item) => item.x === x && item.y === y);
      if (!sq) return { sx: 1, sy: 1 };
      const ratio = sq.frames / 6;
      return {
        sx: 1 + 0.18 * ratio,
        sy: 1 - 0.15 * ratio
      };
    }

    function draw() {
      ctx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);

      ctx.strokeStyle = "#e0e3e8";
      ctx.lineWidth = 1;
      for (let x = 1; x < COLS; x++) {
        ctx.beginPath();
        ctx.moveTo(x * cellSize, 0);
        ctx.lineTo(x * cellSize, boardCanvas.height);
        ctx.stroke();
      }
      for (let y = 1; y < VISIBLE_ROWS; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * cellSize);
        ctx.lineTo(boardCanvas.width, y * cellSize);
        ctx.stroke();
      }

      const dx = 2 * cellSize + cellSize / 2;
      const dy = cellSize / 2;
      ctx.strokeStyle = "rgba(220,38,38,0.35)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(dx - 6, dy - 6);
      ctx.lineTo(dx + 6, dy + 6);
      ctx.moveTo(dx + 6, dy - 6);
      ctx.lineTo(dx - 6, dy + 6);
      ctx.stroke();

      for (let y = HIDDEN_ROWS; y < TOTAL_ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const c = board[y][x];
          if (!c) continue;
          const link = {
            up: y > HIDDEN_ROWS && board[y - 1][x] === c,
            down: y < TOTAL_ROWS - 1 && board[y + 1][x] === c,
            left: x > 0 && board[y][x - 1] === c,
            right: x < COLS - 1 && board[y][x + 1] === c
          };
          const pop = poppingCells.get(`${x},${y}`);
          const sq = getSquashScale(x, y);
          const sx = pop ? pop.scaleX : sq.sx;
          const sy = pop ? pop.scaleY : sq.sy;
          paintPuyo(ctx, x * cellSize, (y - HIDDEN_ROWS) * cellSize, cellSize, c, link, 1, sx, sy);
        }
      }

      if (current && running && !gameOver) {
        if (showGhost && !resolving) {
          let gy = current.y;
          while (canPlace(current.x, gy + 1, current.rot)) gy += 1;
          const gs = subPos(current.x, gy, current.rot);
          if (gy >= HIDDEN_ROWS) {
            paintPuyo(ctx, current.x * cellSize, (gy - HIDDEN_ROWS) * cellSize, cellSize, current.main, null, 0.22);
          }
          if (gs.y >= HIDDEN_ROWS) {
            paintPuyo(ctx, gs.x * cellSize, (gs.y - HIDDEN_ROWS) * cellSize, cellSize, current.sub, null, 0.22);
          }
        }

        const s = subPos(current.x, current.y, current.rot);
        paintPuyo(ctx, current.x * cellSize, (current.y - HIDDEN_ROWS) * cellSize, cellSize, current.main);
        paintPuyo(ctx, s.x * cellSize, (s.y - HIDDEN_ROWS) * cellSize, cellSize, current.sub);
      }

      for (const pt of particles) {
        ctx.save();
        ctx.globalAlpha = pt.alpha;
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // タイトル色数選択
    document.querySelectorAll(".color-choice").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".color-choice").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        colorCount = Number(btn.dataset.colors);
      });
    });

    // スタート
    startBtn.addEventListener("click", () => {
      titleScreen.classList.add("hidden");
      resetBoardState();
    });

    // 設定開閉
    settingsBtn.addEventListener("click", () => {
      if (!running || gameOver) return;
      settingsOpen = true;
      clearFallTimer();
      settingsModal.classList.add("open");
    });

    closeSettingsBtn.addEventListener("click", () => {
      settingsOpen = false;
      settingsModal.classList.remove("open");
      setupFallTimer();
      draw();
    });

    // 落下スピード
    document.querySelectorAll(".speed-choice").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".speed-choice").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        dropMs = Number(btn.dataset.speed);
        setupFallTimer();
      });
    });

    // フリック感度
    document.querySelectorAll(".sens-choice").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".sens-choice").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        sensitivity = btn.dataset.sens;
      });
    });

    // ゴースト表示
    document.querySelectorAll(".ghost-choice").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".ghost-choice").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        showGhost = btn.dataset.ghost === "1";
        draw();
      });
    });

    // リセット / リトライ / タイトルへ戻る
    resetBtn.addEventListener("click", resetBoardState);
    retryBtn.addEventListener("click", resetBoardState);
    backTitleBtn.addEventListener("click", goToTitle);

    // タッチ・マウス操作
    let dragging = false;
    let startX = 0;
    let startY = 0;
    let lastX = 0;
    let lastY = 0;
    let startT = 0;
    let moved = false;

    gameScreen.addEventListener("pointerdown", (e) => {
      if (!canControl()) return;
      if (e.target.closest("button") || e.target.closest(".modal-bg")) return;
      dragging = true;
      startX = lastX = e.clientX;
      startY = lastY = e.clientY;
      startT = performance.now();
      moved = false;
    });

    gameScreen.addEventListener("pointermove", (e) => {
      if (!dragging || !canControl()) return;
      const preset = SENSITIVITY_PRESETS[sensitivity] || SENSITIVITY_PRESETS.mid;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      const step = cellSize * preset.stepRatio;

      if (Math.abs(dx) >= step) {
        moveX(dx > 0 ? 1 : -1);
        lastX = e.clientX;
        moved = true;
      }
      if (dy >= step) {
        stepDown();
        lastY = e.clientY;
        moved = true;
      }
    });

    function finishPointer(e) {
      if (!dragging) return;
      dragging = false;
      if (!canControl()) return;

      const preset = SENSITIVITY_PRESETS[sensitivity] || SENSITIVITY_PRESETS.mid;
      const totalDx = e.clientX - startX;
      const totalDy = e.clientY - startY;
      const dt = performance.now() - startT;

      if (totalDy > preset.flickDist && Math.abs(totalDy) > Math.abs(totalDx) * 1.5 && dt < 280) {
        dropHard();
        return;
      }

      if (!moved && Math.abs(totalDx) < 12 && Math.abs(totalDy) < 12) {
        if (e.clientX < window.innerWidth / 2) {
          turn(-1);
        } else {
          turn(1);
        }
      }
    }

    gameScreen.addEventListener("pointerup", finishPointer);
    gameScreen.addEventListener("pointercancel", finishPointer);

    // PCキーボード補助
    window.addEventListener("keydown", (e) => {
      if (!canControl()) return;
      if (e.key === "ArrowLeft") moveX(-1);
      else if (e.key === "ArrowRight") moveX(1);
      else if (e.key === "ArrowDown") stepDown();
      else if (e.key === "ArrowUp") dropHard();
      else if (e.key === "z" || e.key === "Z") turn(-1);
      else if (e.key === "x" || e.key === "X") turn(1);
    });

    window.addEventListener("resize", fitBoard);
    fitBoard();
  </script>
</body>
</html>
