<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ぷよぷよ" />
  <title>ぷよぷよ</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0b0d10;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* タイトル画面 */
    #title-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 25%, #171b22 0%, #0b0d10 72%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      z-index: 100;
      padding: 24px;
    }

    #title-screen.hidden {
      display: none;
    }

    #title-settings-btn {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 44px;
      height: 44px;
      border-radius: 11px;
      border: 1px solid #272c37;
      background: #14171d;
      color: #e5e7eb;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 110;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
    }

    #title-settings-btn:active {
      background: #1f242e;
    }

    .title-logo {
      margin: 0;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 0.16em;
      color: #f9fafb;
    }

    .start-btn {
      padding: 14px 48px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #0b0d10;
      background: #f9fafb;
      border: 1px solid #ffffff;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .start-btn:active {
      background: #d1d5db;
    }

    /* ゲーム画面 */
    #game-screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 12px 14px;
      position: relative;
      touch-action: none;
      background: radial-gradient(circle at 50% 20%, #151920 0%, #0b0d10 75%);
    }

    #settings-btn {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 44px;
      height: 44px;
      border-radius: 11px;
      border: 1px solid #272c37;
      background: #14171d;
      color: #e5e7eb;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 40;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
    }

    #settings-btn:active {
      background: #1f242e;
    }

    .stage {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 8px;
    }

    .board-box {
      position: relative;
      background: #12151b;
      border: 1px solid #262b36;
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.6);
    }

    #board-canvas {
      display: block;
      background: #0d1015;
      border-radius: 8px;
    }

    .next-box {
      background: #12151b;
      border: 1px solid #262b36;
      border-radius: 12px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
    }

    .next-title {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #9ca3af;
    }

    #next-canvas {
      display: block;
    }

    /* シックな連鎖カットイン演出 */
    #chain-pop {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.3);
      font-size: 23px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 0.05em;
      color: #f9fafb;
      -webkit-text-stroke: 1px #090b0e;
      text-shadow: 0 4px 14px rgba(0, 0, 0, 0.85);
      pointer-events: none;
      opacity: 0;
      white-space: nowrap;
      z-index: 15;
    }

    #chain-pop.show {
      animation: puyoChainPop 0.82s cubic-bezier(0.22, 1.45, 0.36, 1) forwards;
    }

    @keyframes puyoChainPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -30%) scale(0.35) rotate(-5deg);
      }
      22% {
        opacity: 1;
        transform: translate(-50%, -54%) scale(1.2) rotate(2deg);
      }
      45% {
        opacity: 1;
        transform: translate(-50%, -48%) scale(0.96) rotate(-1deg);
      }
      75% {
        opacity: 1;
        transform: translate(-50%, -52%) scale(1.04) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -68%) scale(0.9) rotate(0deg);
      }
    }

    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #6b7280;
      text-align: center;
      letter-spacing: 0.02em;
    }

    /* 設定モーダル（シックなカード＆行リストスタイル） */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(4, 6, 9, 0.78);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 120;
      padding: 18px;
    }

    .modal-bg.open {
      display: flex;
    }

    .modal-panel {
      width: 100%;
      max-width: 340px;
      max-height: 88vh;
      overflow-y: auto;
      background: #11141a;
      border: 1px solid #232834;
      border-radius: 16px;
      padding: 18px 16px;
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.72);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e232e;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #f9fafb;
    }

    .modal-badge {
      font-size: 10px;
      font-weight: 700;
      color: #9ca3af;
      background: #181c24;
      border: 1px solid #262c38;
      border-radius: 999px;
      padding: 3px 9px;
    }

    .setting-card {
      background: #161a22;
      border: 1px solid #222733;
      border-radius: 12px;
      padding: 11px 12px;
      margin-bottom: 10px;
    }

    .setting-card.hidden-setting {
      display: none;
    }

    .setting-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #9ca3af;
      margin: 0;
    }

    .current-val {
      font-size: 11px;
      font-weight: 700;
      color: #e5e7eb;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .chip-btn {
      padding: 8px 6px;
      border-radius: 8px;
      border: 1px solid #272d3a;
      background: #1c212b;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.14s ease, border-color 0.14s ease, color 0.14s ease;
    }

    .chip-btn.active {
      background: #f3f4f6;
      border-color: #ffffff;
      color: #0b0d10;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
    }

    .act-btn {
      width: 100%;
      padding: 11px;
      border-radius: 10px;
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
    }

    .act-btn.hidden-action {
      display: none;
    }

    .act-reset {
      background: rgba(239, 68, 68, 0.13);
      border-color: rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    .act-secondary {
      background: #1b2029;
      border-color: #2b3240;
      color: #e5e7eb;
    }

    .act-close {
      background: #f3f4f6;
      color: #0b0d10;
    }

    .gameover-title {
      margin: 4px 0 16px;
      font-size: 16px;
      font-weight: 800;
      text-align: center;
      color: #f9fafb;
    }
  </style>
</head>
<body>
  <!-- タイトル画面 -->
  <div id="title-screen">
    <button type="button" id="title-settings-btn">設定</button>
    <h1 class="title-logo">ぷよぷよ</h1>
    <button type="button" id="start-btn" class="start-btn">スタート</button>
  </div>

  <!-- ゲーム画面 -->
  <div id="game-screen">
    <button type="button" id="settings-btn">設定</button>

    <div class="stage">
      <div class="board-box">
        <canvas id="board-canvas"></canvas>
        <div id="chain-pop">2連鎖!</div>
      </div>

      <div class="next-box">
        <div class="next-title">NEXT</div>
        <canvas id="next-canvas" width="32" height="120"></canvas>
      </div>
    </div>

    <div class="hint">左右スワイプ: 移動 / 下ドラッグ・フリック: 落下 / 左右タップ: 回転</div>
  </div>

  <!-- 設定モーダル（タイトル・ゲーム画面 共用） -->
  <div id="settings-modal" class="modal-bg">
    <div class="modal-panel">
      <div class="modal-header">
        <h2>設定</h2>
        <span id="modal-context-badge" class="modal-badge">TITLE</span>
      </div>

      <div class="setting-card">
        <div class="setting-card-head">
          <span class="label">落下スピード</span>
          <span id="speed-val-label" class="current-val">ふつう</span>
        </div>
        <div class="grid-2">
          <button type="button" class="chip-btn speed-choice" data-speed="0" data-label="手動のみ">手動のみ</button>
          <button type="button" class="chip-btn speed-choice" data-speed="1000" data-label="ゆっくり">ゆっくり</button>
          <button type="button" class="chip-btn speed-choice active" data-speed="600" data-label="ふつう">ふつう</button>
          <button type="button" class="chip-btn speed-choice" data-speed="250" data-label="はやい">はやい</button>
        </div>
      </div>

      <div id="color-setting-card" class="setting-card">
        <div class="setting-card-head">
          <span class="label">ぷよの色数</span>
          <span id="color-val-label" class="current-val">4色</span>
        </div>
        <div class="grid-3">
          <button type="button" class="chip-btn color-choice" data-colors="3" data-label="3色">3色</button>
          <button type="button" class="chip-btn color-choice active" data-colors="4" data-label="4色">4色</button>
          <button type="button" class="chip-btn color-choice" data-colors="5" data-label="5色">5色</button>
        </div>
      </div>

      <div class="setting-card">
        <div class="setting-card-head">
          <span class="label">フリック感度</span>
          <span id="sens-val-label" class="current-val">ふつう</span>
        </div>
        <div class="grid-3">
          <button type="button" class="chip-btn sens-choice" data-sens="low" data-label="ゆったり">ゆったり</button>
          <button type="button" class="chip-btn sens-choice active" data-sens="mid" data-label="ふつう">ふつう</button>
          <button type="button" class="chip-btn sens-choice" data-sens="high" data-label="敏感">敏感</button>
        </div>
      </div>

      <div class="setting-card">
        <div class="setting-card-head">
          <span class="label">落下予測（ゴースト）</span>
          <span id="ghost-val-label" class="current-val">表示する</span>
        </div>
        <div class="grid-2">
          <button type="button" class="chip-btn ghost-choice active" data-ghost="1" data-label="表示する">表示する</button>
          <button type="button" class="chip-btn ghost-choice" data-ghost="0" data-label="非表示">非表示</button>
        </div>
      </div>

      <div class="actions">
        <button type="button" id="reset-btn" class="act-btn act-reset">盤面をリセット</button>
        <button type="button" id="modal-title-btn" class="act-btn act-secondary">タイトル画面へ</button>
        <button type="button" id="close-settings-btn" class="act-btn act-close">閉じる</button>
      </div>
    </div>
  </div>

  <!-- ゲームオーバーモーダル -->
  <div id="gameover-modal" class="modal-bg">
    <div class="modal-panel">
      <h2 class="gameover-title">ここまで積み上がりました</h2>
      <div class="actions">
        <button type="button" id="retry-btn" class="act-btn act-close">リトライ</button>
        <button type="button" id="back-title-btn" class="act-btn act-secondary">タイトル画面へ</button>
      </div>
    </div>
  </div>

  <script>
    (function setupAppIcon() {
      const svgIcon = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <defs>
            <radialGradient id="bgGrad" cx="50%" cy="32%" r="70%">
              <stop offset="0%" stop-color="#1d222c"/>
              <stop offset="100%" stop-color="#0b0d10"/>
            </radialGradient>
            <radialGradient id="puyoRed" cx="35%" cy="28%" r="72%">
              <stop offset="0%" stop-color="#fecaca"/>
              <stop offset="48%" stop-color="#ef4444"/>
              <stop offset="100%" stop-color="#7f1d1d"/>
            </radialGradient>
            <radialGradient id="puyoBlue" cx="35%" cy="28%" r="72%">
              <stop offset="0%" stop-color="#bfdbfe"/>
              <stop offset="48%" stop-color="#3b82f6"/>
              <stop offset="100%" stop-color="#1e3a8a"/>
            </radialGradient>
            <radialGradient id="puyoGreen" cx="35%" cy="28%" r="72%">
              <stop offset="0%" stop-color="#bbf7d0"/>
              <stop offset="48%" stop-color="#22c55e"/>
              <stop offset="100%" stop-color="#14532d"/>
            </radialGradient>
          </defs>
          <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
          <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="#252b37" stroke-width="4"/>

          <path d="M112 215 C112 145, 224 145, 224 215 C224 275, 112 275, 112 215 Z" fill="url(#puyoRed)"/>
          <ellipse cx="148" cy="186" rx="22" ry="12" transform="rotate(-28 148 186)" fill="rgba(255,255,255,0.68)"/>

          <path d="M286 235 C286 165, 398 165, 398 235 C398 295, 286 295, 286 235 Z" fill="url(#puyoBlue)"/>
          <ellipse cx="322" cy="206" rx="22" ry="12" transform="rotate(-28 322 206)" fill="rgba(255,255,255,0.68)"/>

          <path d="M196 325 C196 250, 316 250, 316 325 C316 392, 196 392, 196 325 Z" fill="url(#puyoGreen)"/>
          <ellipse cx="234" cy="292" rx="24" ry="13" transform="rotate(-28 234 292)" fill="rgba(255,255,255,0.72)"/>
        </svg>
      `.trim();

      const iconUrl = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgIcon);

      const appleLink = document.createElement("link");
      appleLink.rel = "apple-touch-icon";
      appleLink.href = iconUrl;
      document.head.appendChild(appleLink);

      const favLink = document.createElement("link");
      favLink.rel = "icon";
      favLink.type = "image/svg+xml";
      favLink.href = iconUrl;
      document.head.appendChild(favLink);

      const manifestObj = {
        name: "ぷよぷよ",
        short_name: "ぷよぷよ",
        start_url: "./",
        display: "standalone",
        background_color: "#0b0d10",
        theme_color: "#0b0d10",
        icons: [
          {
            src: iconUrl,
            sizes: "512x512",
            type: "image/svg+xml",
            purpose: "any maskable"
          }
        ]
      };

      try {
        const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: "application/manifest+json" });
        const manifestUrl = URL.createObjectURL(manifestBlob);
        const manifestLink = document.createElement("link");
        manifestLink.rel = "manifest";
        manifestLink.href = manifestUrl;
        document.head.appendChild(manifestLink);
      } catch (_) {}
    })();

    const COLS = 6;
    const VISIBLE_ROWS = 12;
    const HIDDEN_ROWS = 1;
    const TOTAL_ROWS = VISIBLE_ROWS + HIDDEN_ROWS;

    const COLORS = [
      null,
      { light: "#fecaca", fill: "#ef4444", deep: "#7f1d1d", bounce: "rgba(254, 202, 202, 0.28)" },
      { light: "#bfdbfe", fill: "#3b82f6", deep: "#1e3a8a", bounce: "rgba(191, 219, 254, 0.28)" },
      { light: "#bbf7d0", fill: "#22c55e", deep: "#14532d", bounce: "rgba(187, 247, 208, 0.28)" },
      { light: "#fef08a", fill: "#eab308", deep: "#713f12", bounce: "rgba(254, 240, 138, 0.28)" },
      { light: "#e9d5ff", fill: "#a855f7", deep: "#581c87", bounce: "rgba(233, 213, 255, 0.28)" }
    ];

    const DIRS = [
      { dx: 0, dy: -1 },
      { dx: 1, dy: 0 },
      { dx: 0, dy: 1 },
      { dx: -1, dy: 0 }
    ];

    const SENSITIVITY_PRESETS = {
      low:  { stepRatio: 0.90, flickDist: 62 },
      mid:  { stepRatio: 0.65, flickDist: 45 },
      high: { stepRatio: 0.42, flickDist: 32 }
    };

    const titleScreen = document.getElementById("title-screen");
    const startBtn = document.getElementById("start-btn");
    const titleSettingsBtn = document.getElementById("title-settings-btn");
    const settingsBtn = document.getElementById("settings-btn");
    const settingsModal = document.getElementById("settings-modal");
    const modalContextBadge = document.getElementById("modal-context-badge");
    const colorSettingCard = document.getElementById("color-setting-card");
    const closeSettingsBtn = document.getElementById("close-settings-btn");
    const resetBtn = document.getElementById("reset-btn");
    const modalTitleBtn = document.getElementById("modal-title-btn");
    const gameoverModal = document.getElementById("gameover-modal");
    const retryBtn = document.getElementById("retry-btn");
    const backTitleBtn = document.getElementById("back-title-btn");
    const chainPop = document.getElementById("chain-pop");

    const speedValLabel = document.getElementById("speed-val-label");
    const colorValLabel = document.getElementById("color-val-label");
    const sensValLabel = document.getElementById("sens-val-label");
    const ghostValLabel = document.getElementById("ghost-val-label");

    const boardCanvas = document.getElementById("board-canvas");
    const ctx = boardCanvas.getContext("2d");
    const nextCanvas = document.getElementById("next-canvas");
    const nextCtx = nextCanvas.getContext("2d");
    const gameScreen = document.getElementById("game-screen");

    let cellSize = 36;
    let board = [];
    let current = null;
    let nextQueue = [];

    let colorCount = 4;
    let dropMs = 600;
    let sensitivity = "mid";
    let showGhost = true;

    let running = false;
    let resolving = false;
    let settingsOpen = false;
    let gameOver = false;
    let fallTimer = null;

    let poppingCells = new Map();
    let particles = [];
    let landingSquash = [];
    let animFrameId = null;

    function fitBoard() {
      const maxH = window.innerHeight - 104;
      const maxW = window.innerWidth - 96;
      cellSize = Math.max(28, Math.min(48, Math.floor(Math.min(maxW / COLS, maxH / VISIBLE_ROWS))));
      boardCanvas.width = COLS * cellSize;
      boardCanvas.height = VISIBLE_ROWS * cellSize;
      draw();
    }

    function randColor() {
      return Math.floor(Math.random() * colorCount) + 1;
    }

    function makePair() {
      return { main: randColor(), sub: randColor() };
    }

    function makeBoard() {
      return Array.from({ length: TOTAL_ROWS }, () => Array(COLS).fill(0));
    }

    function clearFallTimer() {
      if (fallTimer !== null) {
        clearInterval(fallTimer);
        fallTimer = null;
      }
    }

    function setupFallTimer() {
      clearFallTimer();
      if (!running || settingsOpen || resolving || gameOver || dropMs <= 0) return;
      fallTimer = setInterval(() => {
        if (running && !settingsOpen && !resolving && !gameOver && current) {
          stepDown();
        }
      }, dropMs);
    }

    function resetBoardState() {
      running = true;
      settingsOpen = false;
      settingsModal.classList.remove("open");
      clearFallTimer();
      board = makeBoard();
      nextQueue = [makePair(), makePair()];
      poppingCells.clear();
      particles = [];
      landingSquash = [];
      resolving = false;
      gameOver = false;
      gameoverModal.classList.remove("open");
      fitBoard();
      spawnNextPiece();
      setupFallTimer();
      draw();
    }

    function goToTitle() {
      clearFallTimer();
      running = false;
      resolving = false;
      settingsOpen = false;
      gameOver = false;
      current = null;
      settingsModal.classList.remove("open");
      gameoverModal.classList.remove("open");
      titleScreen.classList.remove("hidden");
    }

    function spawnNextPiece() {
      const pair = nextQueue.shift();
      nextQueue.push(makePair());
      drawNext();

      current = {
        x: 2,
        y: 1,
        rot: 0,
        main: pair.main,
        sub: pair.sub
      };

      if (board[1][2] !== 0) {
        current = null;
        gameOver = true;
        clearFallTimer();
        gameoverModal.classList.add("open");
      }
    }

    function subPos(x, y, rot) {
      return { x: x + DIRS[rot].dx, y: y + DIRS[rot].dy };
    }

    function canPlace(x, y, rot) {
      const s = subPos(x, y, rot);
      const pts = [{ x, y }, s];
      for (const p of pts) {
        if (p.x < 0 || p.x >= COLS || p.y < 0 || p.y >= TOTAL_ROWS) return false;
        if (board[p.y][p.x] !== 0) return false;
      }
      return true;
    }

    function canControl() {
      return running && !settingsOpen && !resolving && !gameOver && current !== null;
    }

    function moveX(dx) {
      if (!canControl()) return;
      if (canPlace(current.x + dx, current.y, current.rot)) {
        current.x += dx;
        draw();
      }
    }

    function turn(dir) {
      if (!canControl()) return;
      const nextRot = (current.rot + dir + 4) % 4;
      if (canPlace(current.x, current.y, nextRot)) {
        current.rot = nextRot;
        draw();
        return;
      }
      const kicks = [
        { dx: -1, dy: 0 },
        { dx: 1, dy: 0 },
        { dx: 0, dy: -1 }
      ];
      for (const k of kicks) {
        if (canPlace(current.x + k.dx, current.y + k.dy, nextRot)) {
          current.x += k.dx;
          current.y += k.dy;
          current.rot = nextRot;
          draw();
          return;
        }
      }
    }

    function stepDown() {
      if (!canControl()) return;
      if (canPlace(current.x, current.y + 1, current.rot)) {
        current.y += 1;
        draw();
      } else {
        fixPiece();
      }
    }

    function dropHard() {
      if (!canControl()) return;
      while (canPlace(current.x, current.y + 1, current.rot)) {
        current.y += 1;
      }
      draw();
      fixPiece();
    }

    function addLandingSquash(x, y) {
      if (y < HIDDEN_ROWS) return;
      landingSquash = landingSquash.filter((item) => !(item.x === x && item.y === y));
      landingSquash.push({ x, y, frames: 6 });
    }

    function fixPiece() {
      if (!current) return;
      clearFallTimer();
      const s = subPos(current.x, current.y, current.rot);
      board[current.y][current.x] = current.main;
      addLandingSquash(current.x, current.y);
      if (s.y >= 0 && s.y < TOTAL_ROWS) {
        board[s.y][s.x] = current.sub;
        addLandingSquash(s.x, s.y);
      }
      current = null;
      startEffectLoop();
      resolveChains();
    }

    function dropFloating() {
      let moved = false;
      for (let x = 0; x < COLS; x++) {
        let writeY = TOTAL_ROWS - 1;
        for (let y = TOTAL_ROWS - 1; y >= 0; y--) {
          if (board[y][x] !== 0) {
            if (y !== writeY) {
              board[writeY][x] = board[y][x];
              board[y][x] = 0;
              moved = true;
            }
            writeY--;
          }
        }
      }
      return moved;
    }

    function findGroups() {
      const seen = Array.from({ length: TOTAL_ROWS }, () => Array(COLS).fill(false));
      const targets = [];

      for (let y = HIDDEN_ROWS; y < TOTAL_ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const c = board[y][x];
          if (c === 0 || seen[y][x]) continue;

          const group = [];
          const q = [{ x, y }];
          seen[y][x] = true;

          while (q.length > 0) {
            const p = q.shift();
            group.push(p);
            for (const d of DIRS) {
              const nx = p.x + d.dx;
              const ny = p.y + d.dy;
              if (
                nx >= 0 && nx < COLS &&
                ny >= HIDDEN_ROWS && ny < TOTAL_ROWS &&
                !seen[ny][nx] &&
                board[ny][nx] === c
              ) {
                seen[ny][nx] = true;
                q.push({ x: nx, y: ny });
              }
            }
          }

          if (group.length >= 4) {
            targets.push(...group);
          }
        }
      }
      return targets;
    }

    const wait = (ms) => new Promise((r) => setTimeout(r, ms));

    function showChainPop(n) {
      if (n < 2) return;
      chainPop.textContent = `${n}連鎖!`;

      const scaleBoost = Math.min(1.42, 1 + (n - 2) * 0.08);
      chainPop.style.fontSize = `${Math.round(23 * scaleBoost)}px`;

      if (n >= 5) {
        chainPop.style.color = "#fda4af";
      } else if (n === 4) {
        chainPop.style.color = "#fdba74";
      } else if (n === 3) {
        chainPop.style.color = "#fde047";
      } else {
        chainPop.style.color = "#f9fafb";
      }

      chainPop.classList.remove("show");
      void chainPop.offsetWidth;
      chainPop.classList.add("show");
    }

    function spawnPopBurst(x, y, colorId) {
      const col = COLORS[colorId];
      if (!col) return;
      const cx = x * cellSize + cellSize / 2;
      const cy = (y - HIDDEN_ROWS) * cellSize + cellSize / 2;

      for (let i = 0; i < 7; i++) {
        const angle = (Math.PI * 2 * i) / 7 + (Math.random() - 0.5) * 0.4;
        const speed = 1.6 + Math.random() * 2.4;
        particles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.2,
          r: Math.max(3, cellSize * (0.09 + Math.random() * 0.06)),
          color: col.fill,
          alpha: 1,
          life: 1
        });
      }
    }

    function startEffectLoop() {
      if (animFrameId !== null) return;
      const step = () => {
        let active = false;

        if (particles.length > 0) {
          active = true;
          for (const pt of particles) {
            pt.x += pt.vx;
            pt.y += pt.vy;
            pt.vy += 0.14;
            pt.life -= 0.055;
            pt.alpha = Math.max(0, pt.life);
          }
          particles = particles.filter((pt) => pt.life > 0);
        }

        if (landingSquash.length > 0) {
          active = true;
          for (const sq of landingSquash) {
            sq.frames -= 1;
          }
          landingSquash = landingSquash.filter((sq) => sq.frames > 0);
        }

        if (poppingCells.size > 0) {
          active = true;
        }

        draw();

        if (active) {
          animFrameId = requestAnimationFrame(step);
        } else {
          animFrameId = null;
        }
      };
      animFrameId = requestAnimationFrame(step);
    }

    async function resolveChains() {
      resolving = true;
      let chain = 0;

      if (dropFloating()) {
        draw();
        await wait(140);
      }

      while (true) {
        const matches = findGroups();
        if (matches.length === 0) break;

        chain += 1;
        showChainPop(chain);

        poppingCells.clear();
        for (const m of matches) {
          poppingCells.set(`${m.x},${m.y}`, {
            scaleX: 1.26,
            scaleY: 1.26,
            color: board[m.y][m.x]
          });
        }
        startEffectLoop();
        draw();
        await wait(150);

        for (const m of matches) {
          const c = board[m.y][m.x];
          board[m.y][m.x] = 0;
          spawnPopBurst(m.x, m.y, c);
        }
        poppingCells.clear();
        startEffectLoop();
        draw();
        await wait(140);

        if (dropFloating()) {
          draw();
          await wait(160);
        }
      }

      resolving = false;
      if (running && !gameOver) {
        spawnNextPiece();
        setupFallTimer();
        draw();
      }
    }

    // ぷよの輪郭を基本としつつ、同色が隣り合う方向へほんの少しだけふっくら膨らませて「ぴとっ」とくっつき感を出す
    function paintPuyo(c2d, px, py, size, colorId, link = null, alpha = 1, scaleX = 1, scaleY = 1) {
      if (!colorId) return;
      const col = COLORS[colorId];
      const cx = px + size / 2;
      const cy = py + size / 2;

      const rx = size * 0.51;
      const ryTop = size * 0.46;
      const ryBot = size * 0.53;

      // ほんのちょっとくっつくための微増分（線や出っ張りにならない範囲）
      const nudge = size * 0.045;
      const nLeft = link && link.left ? nudge : 0;
      const nRight = link && link.right ? nudge : 0;
      const nUp = link && link.up ? nudge : 0;
      const nDown = link && link.down ? nudge : 0;

      const leftX = cx - rx - nLeft;
      const rightX = cx + rx + nRight;
      const topY = cy - ryTop * 1.15 - nUp;
      const botY = cy + ryBot * 1.06 + nDown;

      c2d.save();
      c2d.globalAlpha = alpha;
      c2d.translate(cx, cy);
      c2d.scale(scaleX, scaleY);
      c2d.translate(-cx, -cy);

      const traceBody = () => {
        c2d.beginPath();
        c2d.moveTo(leftX, cy);
        c2d.bezierCurveTo(
          leftX, topY,
          rightX, topY,
          rightX, cy
        );
        c2d.bezierCurveTo(
          rightX + nRight * 0.25, botY,
          leftX - nLeft * 0.25, botY,
          leftX, cy
        );
        c2d.closePath();
      };

      traceBody();
      const baseGrad = c2d.createLinearGradient(cx, topY, cx, botY);
      baseGrad.addColorStop(0, col.light);
      baseGrad.addColorStop(0.32, col.fill);
      baseGrad.addColorStop(1, col.deep);
      c2d.fillStyle = baseGrad;
      c2d.fill();

      c2d.save();
      traceBody();
      c2d.clip();

      const innerLight = c2d.createRadialGradient(
        cx - rx * 0.34,
        cy - ryTop * 0.42,
        size * 0.02,
        cx - rx * 0.18,
        cy - ryTop * 0.18,
        rx * 1.15
      );
      innerLight.addColorStop(0, "rgba(255, 255, 255, 0.34)");
      innerLight.addColorStop(0.65, "rgba(255, 255, 255, 0.03)");
      innerLight.addColorStop(1, "rgba(0, 0, 0, 0)");
      c2d.fillStyle = innerLight;
      c2d.fillRect(px - size * 0.15, py - size * 0.15, size * 1.3, size * 1.3);

      const bounceGrad = c2d.createLinearGradient(cx, cy + ryBot * 0.25, cx, botY);
      bounceGrad.addColorStop(0, "rgba(0, 0, 0, 0)");
      bounceGrad.addColorStop(1, col.bounce);
      c2d.fillStyle = bounceGrad;
      c2d.fillRect(px - size * 0.15, py - size * 0.15, size * 1.3, size * 1.3);

      const softSpec = c2d.createRadialGradient(
        cx - rx * 0.34,
        cy - ryTop * 0.38,
        1,
        cx - rx * 0.34,
        cy - ryTop * 0.38,
        rx * 0.42
      );
      softSpec.addColorStop(0, "rgba(255, 255, 255, 0.42)");
      softSpec.addColorStop(1, "rgba(255, 255, 255, 0)");
      c2d.fillStyle = softSpec;
      c2d.beginPath();
      c2d.arc(cx - rx * 0.34, cy - ryTop * 0.38, rx * 0.42, 0, Math.PI * 2);
      c2d.fill();

      c2d.restore();

      c2d.fillStyle = "rgba(255, 255, 255, 0.78)";
      c2d.beginPath();
      c2d.ellipse(
        cx - rx * 0.34,
        cy - ryTop * 0.38,
        Math.max(1.8, rx * 0.15),
        Math.max(1.1, ryTop * 0.085),
        -0.55,
        0,
        Math.PI * 2
      );
      c2d.fill();

      c2d.restore();
    }

    function drawNext() {
      nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
      if (nextQueue.length < 2) return;

      const p1 = nextQueue[0];
      const p2 = nextQueue[1];

      const s1 = 28;
      const x1 = (nextCanvas.width - s1) / 2;
      paintPuyo(nextCtx, x1, 2, s1, p1.sub);
      paintPuyo(nextCtx, x1, 2 + s1 - 2, s1, p1.main);

      nextCtx.strokeStyle = "#242933";
      nextCtx.lineWidth = 1;
      nextCtx.beginPath();
      nextCtx.moveTo(4, 62);
      nextCtx.lineTo(nextCanvas.width - 4, 62);
      nextCtx.stroke();

      const s2 = 20;
      const x2 = (nextCanvas.width - s2) / 2;
      paintPuyo(nextCtx, x2, 70, s2, p2.sub);
      paintPuyo(nextCtx, x2, 70 + s2 - 2, s2, p2.main);
    }

    function getSquashScale(x, y) {
      const sq = landingSquash.find((item) => item.x === x && item.y === y);
      if (!sq) return { sx: 1, sy: 1 };
      const ratio = sq.frames / 6;
      return {
        sx: 1 + 0.18 * ratio,
        sy: 1 - 0.15 * ratio
      };
    }

    function draw() {
      ctx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);

      ctx.strokeStyle = "#191e27";
      ctx.lineWidth = 1;
      for (let x = 1; x < COLS; x++) {
        ctx.beginPath();
        ctx.moveTo(x * cellSize, 0);
        ctx.lineTo(x * cellSize, boardCanvas.height);
        ctx.stroke();
      }
      for (let y = 1; y < VISIBLE_ROWS; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * cellSize);
        ctx.lineTo(boardCanvas.width, y * cellSize);
        ctx.stroke();
      }

      const dx = 2 * cellSize + cellSize / 2;
      const dy = cellSize / 2;
      ctx.strokeStyle = "rgba(248, 113, 113, 0.35)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(dx - 6, dy - 6);
      ctx.lineTo(dx + 6, dy + 6);
      ctx.moveTo(dx + 6, dy - 6);
      ctx.lineTo(dx - 6, dy + 6);
      ctx.stroke();

      for (let y = HIDDEN_ROWS; y < TOTAL_ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const c = board[y][x];
          if (!c) continue;
          const link = {
            up: y > HIDDEN_ROWS && board[y - 1][x] === c,
            down: y < TOTAL_ROWS - 1 && board[y + 1][x] === c,
            left: x > 0 && board[y][x - 1] === c,
            right: x < COLS - 1 && board[y][x + 1] === c
          };
          const pop = poppingCells.get(`${x},${y}`);
          const sq = getSquashScale(x, y);
          const sx = pop ? pop.scaleX : sq.sx;
          const sy = pop ? pop.scaleY : sq.sy;
          paintPuyo(ctx, x * cellSize, (y - HIDDEN_ROWS) * cellSize, cellSize, c, link, 1, sx, sy);
        }
      }

      if (current && running && !gameOver) {
        if (showGhost && !resolving) {
          let gy = current.y;
          while (canPlace(current.x, gy + 1, current.rot)) gy += 1;
          const gs = subPos(current.x, gy, current.rot);
          if (gy >= HIDDEN_ROWS) {
            paintPuyo(ctx, current.x * cellSize, (gy - HIDDEN_ROWS) * cellSize, cellSize, current.main, null, 0.22);
          }
          if (gs.y >= HIDDEN_ROWS) {
            paintPuyo(ctx, gs.x * cellSize, (gs.y - HIDDEN_ROWS) * cellSize, cellSize, current.sub, null, 0.22);
          }
        }

        const s = subPos(current.x, current.y, current.rot);
        paintPuyo(ctx, current.x * cellSize, (current.y - HIDDEN_ROWS) * cellSize, cellSize, current.main);
        paintPuyo(ctx, s.x * cellSize, (s.y - HIDDEN_ROWS) * cellSize, cellSize, current.sub);
      }

      for (const pt of particles) {
        ctx.save();
        ctx.globalAlpha = pt.alpha;
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function openSettings(fromTitle) {
      if (fromTitle) {
        modalContextBadge.textContent = "TITLE";
        colorSettingCard.classList.remove("hidden-setting");
        resetBtn.classList.add("hidden-action");
        modalTitleBtn.classList.add("hidden-action");
      } else {
        if (!running || gameOver) return;
        modalContextBadge.textContent = "GAME";
        colorSettingCard.classList.add("hidden-setting");
        resetBtn.classList.remove("hidden-action");
        modalTitleBtn.classList.remove("hidden-action");
        settingsOpen = true;
        clearFallTimer();
      }
      settingsModal.classList.add("open");
    }

    function closeSettings() {
      settingsModal.classList.remove("open");
      if (running) {
        settingsOpen = false;
        setupFallTimer();
        draw();
      }
    }

    startBtn.addEventListener("click", () => {
      titleScreen.classList.add("hidden");
      resetBoardState();
    });

    titleSettingsBtn.addEventListener("click", () => {
      openSettings(true);
    });

    settingsBtn.addEventListener("click", () => {
      openSettings(false);
    });

    closeSettingsBtn.addEventListener("click", closeSettings);
    modalTitleBtn.addEventListener("click", goToTitle);

    document.querySelectorAll(".speed-choice").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".speed-choice").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        dropMs = Number(btn.dataset.speed);
        speedValLabel.textContent = btn.dataset.label;
        if (running) setupFallTimer();
      });
    });

    document.querySelectorAll(".color-choice").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".color-choice").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        colorCount = Number(btn.dataset.colors);
        colorValLabel.textContent = btn.dataset.label;
      });
    });

    document.querySelectorAll(".sens-choice").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".sens-choice").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        sensitivity = btn.dataset.sens;
        sensValLabel.textContent = btn.dataset.label;
      });
    });

    document.querySelectorAll(".ghost-choice").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".ghost-choice").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        showGhost = btn.dataset.ghost === "1";
        ghostValLabel.textContent = btn.dataset.label;
        draw();
      });
    });

    resetBtn.addEventListener("click", resetBoardState);
    retryBtn.addEventListener("click", resetBoardState);
    backTitleBtn.addEventListener("click", goToTitle);

    let dragging = false;
    let startX = 0;
    let startY = 0;
    let lastX = 0;
    let lastY = 0;
    let startT = 0;
    let moved = false;

    gameScreen.addEventListener("pointerdown", (e) => {
      if (!canControl()) return;
      if (e.target.closest("button") || e.target.closest(".modal-bg")) return;
      dragging = true;
      startX = lastX = e.clientX;
      startY = lastY = e.clientY;
      startT = performance.now();
      moved = false;
    });

    gameScreen.addEventListener("pointermove", (e) => {
      if (!dragging || !canControl()) return;
      const preset = SENSITIVITY_PRESETS[sensitivity] || SENSITIVITY_PRESETS.mid;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      const step = cellSize * preset.stepRatio;

      if (Math.abs(dx) >= step) {
        moveX(dx > 0 ? 1 : -1);
        lastX = e.clientX;
        moved = true;
      }
      if (dy >= step) {
        stepDown();
        lastY = e.clientY;
        moved = true;
      }
    });

    function finishPointer(e) {
      if (!dragging) return;
      dragging = false;
      if (!canControl()) return;

      const preset = SENSITIVITY_PRESETS[sensitivity] || SENSITIVITY_PRESETS.mid;
      const totalDx = e.clientX - startX;
      const totalDy = e.clientY - startY;
      const dt = performance.now() - startT;

      if (totalDy > preset.flickDist && Math.abs(totalDy) > Math.abs(totalDx) * 1.5 && dt < 280) {
        dropHard();
        return;
      }

      if (!moved && Math.abs(totalDx) < 12 && Math.abs(totalDy) < 12) {
        if (e.clientX < window.innerWidth / 2) {
          turn(-1);
        } else {
          turn(1);
        }
      }
    }

    gameScreen.addEventListener("pointerup", finishPointer);
    gameScreen.addEventListener("pointercancel", finishPointer);

    window.addEventListener("keydown", (e) => {
      if (!canControl()) return;
      if (e.key === "ArrowLeft") moveX(-1);
      else if (e.key === "ArrowRight") moveX(1);
      else if (e.key === "ArrowDown") stepDown();
      else if (e.key === "ArrowUp") dropHard();
      else if (e.key === "z" || e.key === "Z") turn(-1);
      else if (e.key === "x" || e.key === "X") turn(1);
    });

    window.addEventListener("resize", fitBoard);
    fitBoard();
  </script>
</body>
</html>
