<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ぷよぷよ</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f4f5f7;
      color: #22262e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* タイトル画面 */
    #title-screen {
      position: fixed;
      inset: 0;
      background: #f4f5f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 100;
      padding: 24px;
    }

    #title-screen.hidden {
      display: none;
    }

    .title-logo {
      margin: 0;
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .title-card {
      width: 100%;
      max-width: 300px;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 14px 16px;
    }

    .label {
      font-size: 12px;
      font-weight: 700;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .chip-btn {
      padding: 9px 6px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      background: #f4f5f7;
      color: #22262e;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .chip-btn.active {
      background: #3b82f6;
      border-color: #3b82f6;
      color: #ffffff;
    }

    .start-btn {
      padding: 14px 44px;
      font-size: 17px;
      font-weight: 800;
      color: #ffffff;
      background: #22262e;
      border: none;
      border-radius: 999px;
      cursor: pointer;
    }

    /* ゲーム画面 */
    #game-screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 12px 14px;
      position: relative;
      touch-action: none;
    }

    #settings-btn {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #22262e;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 40;
    }

    .stage {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 8px;
    }

    .board-box {
      position: relative;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 6px;
    }

    #board-canvas {
      display: block;
      background: #ebedf0;
      border-radius: 8px;
    }

    .next-box {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .next-title {
      font-size: 10px;
      font-weight: 800;
      color: #6b7280;
    }

    #next-canvas {
      display: block;
    }

    #chain-pop {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(34, 38, 46, 0.9);
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
      padding: 7px 16px;
      border-radius: 999px;
      pointer-events: none;
      display: none;
      white-space: nowrap;
    }

    #chain-pop.show {
      display: block;
    }

    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #6b7280;
      text-align: center;
    }

    /* モーダル */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 80;
      padding: 20px;
    }

    .modal-bg.open {
      display: flex;
    }

    .modal-panel {
      width: 100%;
      max-width: 310px;
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
    }

    .modal-panel h2 {
      margin: 0 0 16px;
      font-size: 17px;
      text-align: center;
    }

    .sec {
      margin-bottom: 16px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 18px;
    }

    .act-btn {
      width: 100%;
      padding: 11px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .act-reset {
      background: #fee2e2;
      color: #dc2626;
    }

    .act-close {
      background: #22262e;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <!-- タイトル画面 -->
  <div id="title-screen">
    <h1 class="title-logo">ぷよぷよ</h1>

    <div class="title-card">
      <div class="label">ぷよの色数</div>
      <div class="grid-3">
        <button type="button" class="chip-btn color-choice" data-colors="3">3色</button>
        <button type="button" class="chip-btn color-choice active" data-colors="4">4色</button>
        <button type="button" class="chip-btn color-choice" data-colors="5">5色</button>
      </div>
    </div>

    <button type="button" id="start-btn" class="start-btn">スタート</button>
  </div>

  <!-- 設定ボタン -->
  <button type="button" id="settings-btn">設定</button>

  <!-- ゲーム画面 -->
  <div id="game-screen">
    <div class="stage">
      <div class="board-box">
        <canvas id="board-canvas"></canvas>
        <div id="chain-pop">2 連鎖!</div>
      </div>

      <div class="next-box">
        <div class="next-title">NEXT</div>
        <canvas id="next-canvas" width="32" height="120"></canvas>
      </div>
    </div>

    <div class="hint">左右スワイプ: 移動 / 下ドラッグ・フリック: 落下 / 左右タップ: 回転</div>
  </div>

  <!-- 設定モーダル -->
  <div id="settings-modal" class="modal-bg">
    <div class="modal-panel">
      <h2>設定</h2>

      <div class="sec">
        <div class="label">落下スピード</div>
        <div class="grid-2">
          <button type="button" class="chip-btn speed-choice" data-speed="0">手動のみ</button>
          <button type="button" class="chip-btn speed-choice" data-speed="1000">ゆっくり</button>
          <button type="button" class="chip-btn speed-choice active" data-speed="600">ふつう</button>
          <button type="button" class="chip-btn speed-choice" data-speed="250">はやい</button>
        </div>
      </div>

      <div class="sec">
        <div class="label">落下予測（ゴースト）</div>
        <div class="grid-2">
          <button type="button" class="chip-btn ghost-choice active" data-ghost="1">表示する</button>
          <button type="button" class="chip-btn ghost-choice" data-ghost="0">非表示</button>
        </div>
      </div>

      <div class="actions">
        <button type="button" id="reset-btn" class="act-btn act-reset">盤面をリセット</button>
        <button type="button" id="close-settings-btn" class="act-btn act-close">閉じる</button>
      </div>
    </div>
  </div>

  <!-- ゲームオーバーモーダル -->
  <div id="gameover-modal" class="modal-bg">
    <div class="modal-panel">
      <h2>ここまで積み上がりました</h2>
      <div class="actions">
        <button type="button" id="retry-btn" class="act-btn act-close">もう一度組み立てる</button>
      </div>
    </div>
  </div>

  <script>
    const COLS = 6;
    const VISIBLE_ROWS = 12;
    const HIDDEN_ROWS = 1;
    const TOTAL_ROWS = VISIBLE_ROWS + HIDDEN_ROWS;

    const COLORS = [
      null,
      { fill: "#ef4444", stroke: "#dc2626" },
      { fill: "#3b82f6", stroke: "#2563eb" },
      { fill: "#22c55e", stroke: "#16a34a" },
      { fill: "#eab308", stroke: "#ca8a04" },
      { fill: "#a855f7", stroke: "#9333ea" }
    ];

    const DIRS = [
      { dx: 0, dy: -1 },
      { dx: 1, dy: 0 },
      { dx: 0, dy: 1 },
      { dx: -1, dy: 0 }
    ];

    const titleScreen = document.getElementById("title-screen");
    const startBtn = document.getElementById("start-btn");
    const settingsBtn = document.getElementById("settings-btn");
    const settingsModal = document.getElementById("settings-modal");
    const closeSettingsBtn = document.getElementById("close-settings-btn");
    const resetBtn = document.getElementById("reset-btn");
    const gameoverModal = document.getElementById("gameover-modal");
    const retryBtn = document.getElementById("retry-btn");
    const chainPop = document.getElementById("chain-pop");

    const boardCanvas = document.getElementById("board-canvas");
    const ctx = boardCanvas.getContext("2d");
    const nextCanvas = document.getElementById("next-canvas");
    const nextCtx = nextCanvas.getContext("2d");
    const gameScreen = document.getElementById("game-screen");

    let cellSize = 36;
    let board = [];
    let current = null;
    let nextQueue = [];

    let colorCount = 4;
    let dropMs = 600;
    let showGhost = true;

    let running = false;
    let resolving = false;
    let settingsOpen = false;
    let gameOver = false;
    let fallTimer = null;

    function fitBoard() {
      const maxH = window.innerHeight - 110;
      const maxW = window.innerWidth - 105;
      cellSize = Math.max(26, Math.min(44, Math.floor(Math.min(maxW / COLS, maxH / VISIBLE_ROWS))));
      boardCanvas.width = COLS * cellSize;
      boardCanvas.height = VISIBLE_ROWS * cellSize;
      draw();
    }

    function randColor() {
      return Math.floor(Math.random() * colorCount) + 1;
    }

    function makePair() {
      return { main: randColor(), sub: randColor() };
    }

    function makeBoard() {
      return Array.from({ length: TOTAL_ROWS }, () => Array(COLS).fill(0));
    }

    function clearFallTimer() {
      if (fallTimer !== null) {
        clearInterval(fallTimer);
        fallTimer = null;
      }
    }

    function setupFallTimer() {
      clearFallTimer();
      if (!running || settingsOpen || resolving || gameOver || dropMs <= 0) return;
      fallTimer = setInterval(() => {
        if (running && !settingsOpen && !resolving && !gameOver && current) {
          stepDown();
        }
      }, dropMs);
    }

    // スタート・リセット・リトライすべてで共通して使う初期化メソッド
    function resetBoardState() {
      running = true;
      settingsOpen = false;
      settingsModal.classList.remove("open");
      clearFallTimer();
      board = makeBoard();
      nextQueue = [makePair(), makePair()];
      resolving = false;
      gameOver = false;
      gameoverModal.classList.remove("open");
      fitBoard();
      spawnNextPiece();
      setupFallTimer();
      draw();
    }

    function spawnNextPiece() {
      const pair = nextQueue.shift();
      nextQueue.push(makePair());
      drawNext();

      current = {
        x: 2,
        y: 1,
        rot: 0,
        main: pair.main,
        sub: pair.sub
      };

      if (board[1][2] !== 0) {
        current = null;
        gameOver = true;
        clearFallTimer();
        gameoverModal.classList.add("open");
      }
    }

    function subPos(x, y, rot) {
      return { x: x + DIRS[rot].dx, y: y + DIRS[rot].dy };
    }

    function canPlace(x, y, rot) {
      const s = subPos(x, y, rot);
      const pts = [{ x, y }, s];
      for (const p of pts) {
        if (p.x < 0 || p.x >= COLS || p.y < 0 || p.y >= TOTAL_ROWS) return false;
        if (board[p.y][p.x] !== 0) return false;
      }
      return true;
    }

    function canControl() {
      return running && !settingsOpen && !resolving && !gameOver && current !== null;
    }

    function moveX(dx) {
      if (!canControl()) return;
      if (canPlace(current.x + dx, current.y, current.rot)) {
        current.x += dx;
        draw();
      }
    }

    function turn(dir) {
      if (!canControl()) return;
      const nextRot = (current.rot + dir + 4) % 4;
      if (canPlace(current.x, current.y, nextRot)) {
        current.rot = nextRot;
        draw();
        return;
      }
      const kicks = [
        { dx: -1, dy: 0 },
        { dx: 1, dy: 0 },
        { dx: 0, dy: -1 }
      ];
      for (const k of kicks) {
        if (canPlace(current.x + k.dx, current.y + k.dy, nextRot)) {
          current.x += k.dx;
          current.y += k.dy;
          current.rot = nextRot;
          draw();
          return;
        }
      }
    }

    function stepDown() {
      if (!canControl()) return;
      if (canPlace(current.x, current.y + 1, current.rot)) {
        current.y += 1;
        draw();
      } else {
        fixPiece();
      }
    }

    function dropHard() {
      if (!canControl()) return;
      while (canPlace(current.x, current.y + 1, current.rot)) {
        current.y += 1;
      }
      draw();
      fixPiece();
    }

    function fixPiece() {
      if (!current) return;
      clearFallTimer();
      const s = subPos(current.x, current.y, current.rot);
      board[current.y][current.x] = current.main;
      if (s.y >= 0 && s.y < TOTAL_ROWS) {
        board[s.y][s.x] = current.sub;
      }
      current = null;
      resolveChains();
    }

    function dropFloating() {
      let moved = false;
      for (let x = 0; x < COLS; x++) {
        let writeY = TOTAL_ROWS - 1;
        for (let y = TOTAL_ROWS - 1; y >= 0; y--) {
          if (board[y][x] !== 0) {
            if (y !== writeY) {
              board[writeY][x] = board[y][x];
              board[y][x] = 0;
              moved = true;
            }
            writeY--;
          }
        }
      }
      return moved;
    }

    function findGroups() {
      const seen = Array.from({ length: TOTAL_ROWS }, () => Array(COLS).fill(false));
      const targets = [];

      for (let y = HIDDEN_ROWS; y < TOTAL_ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const c = board[y][x];
          if (c === 0 || seen[y][x]) continue;

          const group = [];
          const q = [{ x, y }];
          seen[y][x] = true;

          while (q.length > 0) {
            const p = q.shift();
            group.push(p);
            for (const d of DIRS) {
              const nx = p.x + d.dx;
              const ny = p.y + d.dy;
              if (
                nx >= 0 && nx < COLS &&
                ny >= HIDDEN_ROWS && ny < TOTAL_ROWS &&
                !seen[ny][nx] &&
                board[ny][nx] === c
              ) {
                seen[ny][nx] = true;
                q.push({ x: nx, y: ny });
              }
            }
          }

          if (group.length >= 4) {
            targets.push(...group);
          }
        }
      }
      return targets;
    }

    const wait = (ms) => new Promise((r) => setTimeout(r, ms));

    function showChainPop(n) {
      if (n < 2) return;
      chainPop.textContent = `${n} 連鎖!`;
      chainPop.classList.add("show");
      setTimeout(() => chainPop.classList.remove("show"), 750);
    }

    async function resolveChains() {
      resolving = true;
      let chain = 0;

      if (dropFloating()) {
        draw();
        await wait(150);
      }

      while (true) {
        const matches = findGroups();
        if (matches.length === 0) break;

        chain += 1;
        showChainPop(chain);

        for (const m of matches) {
          board[m.y][m.x] = 0;
        }
        draw();
        await wait(230);

        if (dropFloating()) {
          draw();
          await wait(170);
        }
      }

      resolving = false;
      if (running && !gameOver) {
        spawnNextPiece();
        setupFallTimer();
        draw();
      }
    }

    function paintPuyo(c2d, px, py, size, colorId, link = null, alpha = 1) {
      if (!colorId) return;
      const col = COLORS[colorId];
      const r = size * 0.42;
      const cx = px + size / 2;
      const cy = py + size / 2;

      c2d.save();
      c2d.globalAlpha = alpha;
      c2d.fillStyle = col.fill;
      c2d.strokeStyle = col.stroke;
      c2d.lineWidth = 2;

      if (link) {
        const bw = r * 1.15;
        if (link.up) c2d.fillRect(cx - bw / 2, py, bw, size / 2);
        if (link.down) c2d.fillRect(cx - bw / 2, cy, bw, size / 2);
        if (link.left) c2d.fillRect(px, cy - bw / 2, size / 2, bw);
        if (link.right) c2d.fillRect(cx, cy - bw / 2, size / 2, bw);
      }

      c2d.beginPath();
      c2d.arc(cx, cy, r, 0, Math.PI * 2);
      c2d.fill();
      c2d.stroke();

      c2d.fillStyle = "rgba(255,255,255,0.35)";
      c2d.beginPath();
      c2d.arc(cx - r * 0.32, cy - r * 0.32, r * 0.22, 0, Math.PI * 2);
      c2d.fill();

      c2d.restore();
    }

    function drawNext() {
      nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
      if (nextQueue.length < 2) return;

      const p1 = nextQueue[0];
      const p2 = nextQueue[1];

      const s1 = 28;
      const x1 = (nextCanvas.width - s1) / 2;
      paintPuyo(nextCtx, x1, 2, s1, p1.sub);
      paintPuyo(nextCtx, x1, 2 + s1 - 2, s1, p1.main);

      nextCtx.strokeStyle = "#e5e7eb";
      nextCtx.lineWidth = 1;
      nextCtx.beginPath();
      nextCtx.moveTo(4, 62);
      nextCtx.lineTo(nextCanvas.width - 4, 62);
      nextCtx.stroke();

      const s2 = 20;
      const x2 = (nextCanvas.width - s2) / 2;
      paintPuyo(nextCtx, x2, 70, s2, p2.sub);
      paintPuyo(nextCtx, x2, 70 + s2 - 2, s2, p2.main);
    }

    function draw() {
      ctx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);

      ctx.strokeStyle = "#e0e3e8";
      ctx.lineWidth = 1;
      for (let x = 1; x < COLS; x++) {
        ctx.beginPath();
        ctx.moveTo(x * cellSize, 0);
        ctx.lineTo(x * cellSize, boardCanvas.height);
        ctx.stroke();
      }
      for (let y = 1; y < VISIBLE_ROWS; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * cellSize);
        ctx.lineTo(boardCanvas.width, y * cellSize);
        ctx.stroke();
      }

      const dx = 2 * cellSize + cellSize / 2;
      const dy = cellSize / 2;
      ctx.strokeStyle = "rgba(220,38,38,0.35)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(dx - 6, dy - 6);
      ctx.lineTo(dx + 6, dy + 6);
      ctx.moveTo(dx + 6, dy - 6);
      ctx.lineTo(dx - 6, dy + 6);
      ctx.stroke();

      for (let y = HIDDEN_ROWS; y < TOTAL_ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const c = board[y][x];
          if (!c) continue;
          const link = {
            up: y > HIDDEN_ROWS && board[y - 1][x] === c,
            down: y < TOTAL_ROWS - 1 && board[y + 1][x] === c,
            left: x > 0 && board[y][x - 1] === c,
            right: x < COLS - 1 && board[y][x + 1] === c
          };
          paintPuyo(ctx, x * cellSize, (y - HIDDEN_ROWS) * cellSize, cellSize, c, link);
        }
      }

      if (current && running && !gameOver) {
        if (showGhost && !resolving) {
          let gy = current.y;
          while (canPlace(current.x, gy + 1, current.rot)) gy += 1;
          const gs = subPos(current.x, gy, current.rot);
          if (gy >= HIDDEN_ROWS) {
            paintPuyo(ctx, current.x * cellSize, (gy - HIDDEN_ROWS) * cellSize, cellSize, current.main, null, 0.22);
          }
          if (gs.y >= HIDDEN_ROWS) {
            paintPuyo(ctx, gs.x * cellSize, (gs.y - HIDDEN_ROWS) * cellSize, cellSize, current.sub, null, 0.22);
          }
        }

        const s = subPos(current.x, current.y, current.rot);
        paintPuyo(ctx, current.x * cellSize, (current.y - HIDDEN_ROWS) * cellSize, cellSize, current.main);
        paintPuyo(ctx, s.x * cellSize, (s.y - HIDDEN_ROWS) * cellSize, cellSize, current.sub);
      }
    }

    // タイトル色数選択
    document.querySelectorAll(".color-choice").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".color-choice").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        colorCount = Number(btn.dataset.colors);
      });
    });

    // スタート（リセットと同じメソッドを適用）
    startBtn.addEventListener("click", () => {
      titleScreen.classList.add("hidden");
      resetBoardState();
    });

    // 設定開閉
    settingsBtn.addEventListener("click", () => {
      if (!running || gameOver) return;
      settingsOpen = true;
      clearFallTimer();
      settingsModal.classList.add("open");
    });

    closeSettingsBtn.addEventListener("click", () => {
      settingsOpen = false;
      settingsModal.classList.remove("open");
      setupFallTimer();
      draw();
    });

    // 落下スピード
    document.querySelectorAll(".speed-choice").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".speed-choice").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        dropMs = Number(btn.dataset.speed);
        setupFallTimer();
      });
    });

    // ゴースト表示
    document.querySelectorAll(".ghost-choice").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".ghost-choice").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        showGhost = btn.dataset.ghost === "1";
        draw();
      });
    });

    // リセット / リトライ
    resetBtn.addEventListener("click", resetBoardState);
    retryBtn.addEventListener("click", resetBoardState);

    // タッチ・マウス操作
    let dragging = false;
    let startX = 0;
    let startY = 0;
    let lastX = 0;
    let lastY = 0;
    let startT = 0;
    let moved = false;

    gameScreen.addEventListener("pointerdown", (e) => {
      if (!canControl()) return;
      if (e.target.closest("button") || e.target.closest(".modal-bg")) return;
      dragging = true;
      startX = lastX = e.clientX;
      startY = lastY = e.clientY;
      startT = performance.now();
      moved = false;
    });

    gameScreen.addEventListener("pointermove", (e) => {
      if (!dragging || !canControl()) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      const step = cellSize * 0.65;

      if (Math.abs(dx) >= step) {
        moveX(dx > 0 ? 1 : -1);
        lastX = e.clientX;
        moved = true;
      }
      if (dy >= step) {
        stepDown();
        lastY = e.clientY;
        moved = true;
      }
    });

    function finishPointer(e) {
      if (!dragging) return;
      dragging = false;
      if (!canControl()) return;

      const totalDx = e.clientX - startX;
      const totalDy = e.clientY - startY;
      const dt = performance.now() - startT;

      if (totalDy > 45 && Math.abs(totalDy) > Math.abs(totalDx) * 1.5 && dt < 260) {
        dropHard();
        return;
      }

      if (!moved && Math.abs(totalDx) < 12 && Math.abs(totalDy) < 12) {
        if (e.clientX < window.innerWidth / 2) {
          turn(-1);
        } else {
          turn(1);
        }
      }
    }

    gameScreen.addEventListener("pointerup", finishPointer);
    gameScreen.addEventListener("pointercancel", finishPointer);

    // PCキーボード補助
    window.addEventListener("keydown", (e) => {
      if (!canControl()) return;
      if (e.key === "ArrowLeft") moveX(-1);
      else if (e.key === "ArrowRight") moveX(1);
      else if (e.key === "ArrowDown") stepDown();
      else if (e.key === "ArrowUp") dropHard();
      else if (e.key === "z" || e.key === "Z") turn(-1);
      else if (e.key === "x" || e.key === "X") turn(1);
    });

    window.addEventListener("resize", fitBoard);
    fitBoard();
  </script>
</body>
</html>
